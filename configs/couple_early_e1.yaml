# E1: the existing SC readout, injected into s_single instead of a_token
#
# One variable against the late pilot (docs/sb_pilot_results.md): the injection
# site. The readout is `pxf.couple.readout.FeedbackReadout` unchanged -- same
# feature groups in the same order, same normalization, same sequence embedding,
# same full / bb_only / generic controls -- so a difference between this and the
# late arms is attributable to where the correction lands and to nothing else.
#
# Everything the late pilot held fixed is held fixed here at the same values:
# the 512-example pool over 128 AFDB structures, 50 packing steps, the bypass
# BB->SC policy, sigma in [0.1, 2.0], lr 1e-4, clip 1.0, 2000 steps, seed 0.
# That is also what lets the runs load the late pilot's own upstream cache: the
# frozen half does not depend on which arm reads it, and the cache identity
# refuses a mismatch rather than warning about one.
#
# The old late A_SB is NOT applied at the same time. The payload type enforces
# it: a ConditioningFeedback is taken by the conditioning hook and declined by
# the decoder hook, so the two sites cannot both be live.
couple:
  phase: sc_to_bb
  max_steps: 2000         # extend to 5000 only if promising
  grad_accum_steps: 1
  pack_steps: 50
  corrective_event: true  # explicit gradient boundary, cacheable frozen half
  bs_policy: bypass       # Gate B is a later, separate stage
  sigma_data_backbone: 16.0
  sidechain_reduction: per_token
  log_every: 25
  checkpoint_every: 500
  eval_steps: [500, 1000, 2000]   # step 0 is always included
  ema_relative_length: 0.25
  seed: 0
sigma:
  mode: trajectory
  sigma_min: 0.1
  sigma_max: 2.0
  n_step: 400
adapters:
  d_hidden: 256
  d_noise: 64
sb_feedback:
  # early_s_full | early_s_bb_only | early_s_generic -- set by --sb-arm.
  arm: early_s_full
  gate:
    sigma_min: 0.1
    sigma_max: 2.0
    taper: 2.0
optim:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 100
  max_grad_norm: 1.0
  schedule: constant
