# PDB preset, Appendix B.2: 4 H100s, batch 8 per GPU, 4 accumulation steps
# (effective batch 128), fixed size 1024, 300k steps. batch_size here is
# per-process, so a single-GPU run reproduces the effective batch with
# grad_accum_steps: 16.
data:
  crop_size: 1024
  spatial_crop_p: 0.5
  batch_size: 8
  num_workers: 8
train:
  max_steps: 300000
  grad_accum_steps: 4
  # 0.3 reproduces the fampnn_0_3 model. The noise goes to the encoder's atom14
  # input only (ProteinFeatures.augment_eps); the diffusion target stays clean.
  structural_noise: 0.3
  ema_relative_length: 0.01   # B.2 chose 1% for the 0.3 A model (post-hoc)
  log_every: 50
  checkpoint_every: 5000
  snapshot_every: 5000
  seed: 0
  amp_dtype: bf16
  loss:
    label_smoothing: 0.1
    seq_per_token_avg: false
    sidechain_reduction: per_token
    weight_seq: 1.0
    weight_sidechain: 1.0
    weight_confidence: 1.0
optim:
  optimizer: noam
  noam_factor: 2.0
  noam_warmup_steps: 4000
  max_grad_norm: 0.0
