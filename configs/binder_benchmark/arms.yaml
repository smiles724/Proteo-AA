# The Phase 1A arm matrix, and what each arm is allowed to conclude.
#
# Seven primary arms over ONE shared set of PXDesign backbones. Sharing the
# backbones is what makes the on/off differences paired: R2 and C2 see the same
# geometry, the same target, the same seed, and differ only in whether the
# BB->SC residual is applied. Anything that changes the backbone belongs in
# Phase 1B, not here.
#
# `scripts/design_binder_matrix.py` reads this file. Nothing about an arm is
# hard-coded there: an arm is its context masks plus its residual source, and
# both are declared below so a run records the definition it used rather than
# the definition someone remembers.
#
# ---------------------------------------------------------------------------
# Three context levels, and why they are separate arms rather than settings
# ---------------------------------------------------------------------------
#
#   binder_only    FaMPNN sees the binder backbone alone. The target is absent
#                  from the sequence model entirely.
#   complex        FaMPNN sees target + binder backbones and the target's fixed
#                  sequence. No target side-chain coordinates are supplied.
#   complex_sc     as complex, plus the target's resolved side chains held
#                  fixed as context.
#
# C1 is NOT "target-unconditioned". Its PXDesign backbone and its a_token were
# produced with the target present, so the target's information is already in
# the geometry and in the residual. What C1 removes is the target from FaMPNN's
# own receptive field. Describing it as unconditioned would overstate every
# conclusion drawn from it.
#
# All arms, including the binder_only pair, are SCORED as complexes: their
# binder output is recombined with the same cached target before AF2-IG. A
# binder scored alone is answering a different question than Table 4 asks.

shared:
  # Every Phase 1A arm consumes the identical backbone collection.
  backbone_source: released_pxdesign
  designer: fampnn
  # A_BS was trained against FaMPNN 0.0. Upstream recommends 0.3 for sequence
  # design, so this is a real conflict and it is resolved in favour of the
  # adapter: the primary comparison must query A_BS in distribution, and the
  # uncoupled arm must use the same donor or the difference is confounded by
  # the donor. 0.3 is available as an external reference, never as the
  # uncoupled half of an on/off pair.
  fampnn_variant: "0.0"
  fampnn_variant_note: >-
    LEGACY FAMILY. Not upstream's recommended sequence-design model. The
    existing A_BS records fampnn_0_0 (sha256 afbdfda2...) as its training donor
    -- hash-verified by scripts/build_checkpoint_manifest.py -- and was trained
    on the PACKING task (phase bb_to_sc, pack_steps 10), not on iterative
    sequence design. Running it against 0.3 would query it out of distribution
    while the tensor widths still match (both donors are 10,513,177
    parameters), so both halves of every legacy on/off pair pin 0.0.
  donor_families:
    legacy:
      fampnn: "0.0"
      adapter: existing A_BS (couple_phase1, step 20000)
      application_mode: packing_only
      role: historical packing/coupling reference
    new_main:
      fampnn: "0.3"
      adapter: fresh A_BS, zero-initialised output projection
      application_mode: shared_prelogit
      task: bs_seq_sc_v1
      role: >-
        joint sequence + side-chain design. Trained by
        scripts/train_bs_seq_sc.py. TRAINED AND SELECTED: J03, 2,000 updates,
        lambda_seq 0.0051, lambda_sc 1.0, sigma_b 0.429, mask_fraction 0.5,
        two seeds. Checkpoint chosen at step 500 for both seeds by the
        predeclared rule in configs/bs_seq_sc/selection.yaml -- the side-chain
        guardrail rules out every later checkpoint. EMA weights.
        seed 0 sha256 c506c7e1c43104dd..., seed 1 sha256 ee673b982c4f5dd7...
        Stage-1 reconstruction results: docs/results/bs_seq_sc_v1_stage1.md.
        Designability on the AlphaProteo panel is NOT yet measured; it needs
        the shared backbone collection, which needs the official runtime.
  donor_policy: >-
    A 0.0 vs 0.3 difference is a DONOR change and is never reported as an
    adapter gain. The existing 0.0 adapter is never loaded on top of 0.3:
    identical widths and a clean load do not establish compatible feature
    distributions.
  seq_steps: 100
  temperature: 0.1
  psce_threshold: 0.3
  repack_last: true
  sequences_per_backbone: 1

# sigma_B is the backbone diffusion noise the a_token is read at. It is NOT
# FaMPNN's sequence-unmasking time and not side-chain diffusion time.
#
# 0.429 is inside every adapter's trained window -- A_BS supports 0.0092-4.76 A
# and the early conditioners 0.099-1.88 A, both verified by
# scripts/build_checkpoint_manifest.py --probe-sigma. It is also the `sigma_on`
# knee of gates A and B, so at this sigma those gates are fully open and the
# arm reproduces the adapter as trained.
#
# It is a development starting point, not a measured optimum. Lock it on the
# dev pilot before the benchmark run.
residual:
  sigma_b: 0.429
  gate: one
  gate_note: >-
    `one` is the ungated adapter exactly as trained. Phase 0 measured the
    residual at this setting as 0.99x the norm of h_V itself, so the gate sweep
    is a real knob and not a formality -- the risk here is an intervention that
    is too strong, not one too weak to matter.
  binder_masked: true
  binder_masked_note: >-
    The residual reaches binder rows only and is bit-exactly zero on target
    rows. An unmasked residual would still perturb the messages the fixed
    target sends through the encoder, which tests a different hypothesis.

arms:
  - id: U03
    context: complex_sc
    residual_source: none
    fampnn_variant: "0.3"
    role: donor_reference
    note: >-
      Upstream's recommended sequence-design donor, adapter OFF. The external
      reference that says what the 0.0 pin costs in absolute designability,
      and the baseline the trained 0.3 adapter (J03, below) is paired against.
      It is NOT the uncoupled half of any 0.0 pair -- pairing across donors
      would confound the donor with the residual.

  - id: J03
    context: complex_sc
    residual_source: matched
    fampnn_variant: "0.3"
    application_mode: shared_prelogit
    pair: U03
    checkpoint: runs/bs_seq_sc/J03_seed{seed}/checkpoints/step00000500.pt
    weights: ema
    seeds: [0, 1]
    note: >-
      The trained bs_seq_sc_v1 adapter, adapter ON, on the 0.3 donor. Its
      uncoupled half is U03 and nothing else: U03 is the same donor with the
      residual off, so the pair isolates the residual.

      This arm is paired with U03 rather than with R0 ON PURPOSE. R0 is
      ProteinMPNN under `context: complex`, so a J03 - R0 difference moves the
      designer, the context level and the adapter at once. R0 is a shared
      absolute reference for the whole matrix, not the uncoupled half of any
      pair; reporting J03 - R0 as an adapter gain would be the same error the
      donor_policy above forbids for 0.0 vs 0.3.

      Note also that J03 and the legacy C3/R3 pair are NOT comparable as
      adapters: different donor (0.3 vs 0.0), different application_mode
      (shared_prelogit vs packing_only) and different training task.

  - id: R0
    designer: proteinmpnn
    context: complex
    residual_source: none
    role: external_baseline
    note: >-
      One shared ProteinMPNN row for all of Phase 1A, because every arm shares
      the same backbones. It is NOT seven independent baselines, and repeating
      it per arm would manufacture agreement out of one measurement.

  - id: R1
    context: binder_only
    residual_source: none
    pair: C1
  - id: C1
    context: binder_only
    residual_source: matched
    pair: R1

  - id: R2
    context: complex
    residual_source: none
    pair: C2
  - id: C2
    context: complex
    residual_source: matched
    pair: R2

  - id: R3
    context: complex_sc
    residual_source: none
    pair: C3
  - id: C3
    context: complex_sc
    residual_source: matched
    pair: R3
    primary: true

comparisons:
  primary: C3 - R3
  secondary: [C2 - R2, C1 - R1]
  new_main_family: J03 - U03
  new_main_family_note: >-
    The 0.3 family's own on/off pair, reported separately from the legacy
    0.0 family rather than pooled with it. Two seeds, reported per
    configs/bs_seq_sc/selection.yaml's seed_policy: both seeds and their
    agreement, not an average that hides a seed-dependent result.
  note: >-
    One primary comparison, declared before any result is seen. The secondaries
    are reported with a declared multiplicity correction or labelled secondary;
    they are not three chances at a positive.

# Controls run only on the primary context, and specified now rather than after
# looking at results. They separate "the residual carries information about
# THIS sample" from "a residual of about this size helps".
mechanism_controls:
  - id: C3_shuffled
    of: C3
    residual_source: matched
    a_token_from: other_protein
    donor_mapping: deterministic_other_protein_same_sigma
    note: >-
      a_token taken from a different protein at the same sigma, gate and scale
      held fixed. If C3 beats R3 and C3_shuffled matches C3, the benefit is not
      sample-specific and must not be described as target-information transfer.
  - id: C3_mean
    of: C3
    residual_source: mean
    note: >-
      mu(sigma) from configs/mean_residual_phase1.json, estimated on TRAINING
      proteins. A mean estimated from the benchmark panel would let the control
      peek at the set it is scored on, which is the one thing this arm exists
      to rule out.
  - id: C3_zero_input
    of: C3
    residual_source: zero_input
    note: >-
      A(0, sigma). Deliberately not the same as bypass: normalization offsets,
      biases and the sigma embedding make it non-zero, and how much of the
      effect that alone explains is the question.
  - id: C3_repack_only
    of: C3
    residual_source: matched
    apply: final_repack_only
    note: >-
      Isolates packing changes from iterative sequence effects. A coupled arm
      can improve packing without improving designability; that is a result in
      itself and is reported as one.
