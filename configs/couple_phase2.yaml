# Phase 2: A_SB on L_BB with the packing detached; A_BS frozen
#
# Only the adapters train; PXDesign and FaMPNN stay frozen, so any gain is
# attributable to the coupling rather than to fine-tuning a component.
# No data source is configured here on purpose -- pass it on the command line.
couple:
  phase: sc_to_bb
  max_steps: 20000
  grad_accum_steps: 1
  pack_steps: 10          # side-chain rollout inside the cycle; 50 at eval time
  sigma_data_backbone: 16.0
  # per_token: the original training code's reduction -- one mean over every
  # supervised coordinate, then the per-example EDM weight. fixed_size divides
  # by the constant crop size instead.
  sidechain_reduction: per_token
  log_every: 25
  checkpoint_every: 1000
  ema_relative_length: 0.25
  seed: 0
# The sigma_B distribution. Both adapters are conditioned on log sigma_B, so
# training at one value makes that conditioning constant and only licenses
# deployment at that value. This is the late end of PXDesign's own 400-step
# schedule -- steps 281-395, where the fold is decided but the geometry is not
# yet final -- and "trajectory" draws from exactly the discrete sigmas the
# sampler visits there.
sigma:
  mode: trajectory       # trajectory | loguniform | fixed
  sigma_min: 0.01        # Angstroms
  sigma_max: 5.0
  n_step: 400            # PXDesign's sample_diffusion.N_step
adapters:
  d_hidden: 256
  d_noise: 64
# Not specified by the plan -- chosen here and recorded in every checkpoint.
optim:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 0.0
  warmup_steps: 500
  max_grad_norm: 1.0
  schedule: constant
