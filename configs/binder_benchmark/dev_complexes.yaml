# Phase 0 development complexes: held out, protein-only, and SCREENED.
#
# Four two-chain complexes from the recentPDB low-homology eval index
# (protenix_data/indices/recentPDB_low_homology_maxtoken1536.csv), the split
# this repo already treats as held out. None is an AlphaProteo target, so
# exercising the harness on them cannot contaminate the benchmark.
#
# "Screened" is the operative word, and it cost a round. The first selection
# filtered on chain composition and three of four then failed at
# featurization:
#
#   7bca  IndexError: index -100 is out of bounds ...  -- protein/DNA complex;
#         the chain filter counted only its two protein chains
#   7pz2  same                                          -- Cl- and SO4 present
#   7qii  InferenceSafeBinder: strict token count 257 != native 287
#
# `aa_clean` marks any non-amino-acid token -100 and a 21-way lookup then
# indexes with it. So the entries below were chosen by ACTUALLY FEATURIZING
# them, not by inspecting the file: of 27 protein-only two-chain candidates in
# the mirror, these four survive `CifFileProvider -> DesignSourceDataset`.
# `tokens` and `design_tokens` are the featurizer's own numbers.
#
# The same failure hits eight of the ten benchmark targets, which carry
# glycans, ions or ligands; see scripts/validate_binder_targets.py. They need
# cropping to amino acids before the backbone driver sees them.
#
# Chain roles are a harness assignment (smaller chain is the binder), not a
# claim that either chain is a designed binder. The authoritative split at run
# time is the featurizer's `design_token_mask`, which ChainRoles is built from.
#
# The gen_stress val set (configs/gen_stress_prepared.parquet, 31 dimers with
# roles already assigned) would be richer, but its prepared CIFs live only
# under /hai and were not transferred.

mmcif_dir: /scratch/m000137-pm06/Proteo-AA/pxf/protenix_data/mmcif
source_index: recentPDB_low_homology_maxtoken1536.csv
selection: protein-only two-chain entries that featurize; screened, not assumed

complexes:
  - id: 7f7p
    target_chain: A
    binder_chain: B
    featurizer_tokens: 192
    featurizer_design_tokens: 96
  - id: 7f91
    target_chain: A
    binder_chain: B
    featurizer_tokens: 280
    featurizer_design_tokens: 140
  - id: 7p0s
    target_chain: A
    binder_chain: B
    featurizer_tokens: 348
    featurizer_design_tokens: 26
  - id: 7ppb
    target_chain: A
    binder_chain: B
    featurizer_tokens: 466
    featurizer_design_tokens: 125
